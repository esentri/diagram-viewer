plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.vaadin' version '24.7.1'
}

group = 'io.domainlifecycles'
version = '0.0.1-SNAPSHOT'

ext {
	set('vaadinVersion', "24.7.1")
	javaDockerVersion = "3.4.0"
	dlcVersion = "2.4.0"
	classGraphVersion = "4.8.163"
	isInternal = System.getenv('BUILD_PROFILE') == 'INTERNAL'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	mavenLocal()
	maven {
		url = uri("https://maven.vaadin.com/vaadin-addons")
	}
}



tasks.named('bootJar') {
	enabled = true
}

dependencies {
	implementation "io.github.classgraph:classgraph:${classGraphVersion}"
	implementation ('org.springframework.boot:spring-boot-starter-web')
	implementation ('com.vaadin:vaadin-spring-boot-starter')
	implementation ('org.springframework.boot:spring-boot-starter-data-jpa')
	implementation ('org.postgresql:postgresql')
	testImplementation ('org.testcontainers:postgresql:1.20.6')
	implementation ('org.springframework.boot:spring-boot-starter-actuator')
	implementation ('com.okta.spring:okta-spring-boot-starter:3.0.6')
	implementation "com.github.docker-java:docker-java-core:${javaDockerVersion}"
	implementation "com.github.docker-java:docker-java-transport-httpclient5:${javaDockerVersion}"
	implementation 'com.flowingcode.vaadin.addons:zoomist-addon:1.0.1'
	implementation 'org.vaadin.addons.taefi:toggle-button-group:2.2.0'
	implementation "io.domainlifecycles:mirror:${dlcVersion}"
	implementation "io.domainlifecycles:diagram-viewer-plugin:1.0"
	implementation "io.domainlifecycles:domain-diagrammer:${dlcVersion}"
	if(isInternal){
		implementation("io.domainlifecycles:diagram-viewer-generator-plugin:1.0")
	}
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation ('org.springframework.boot:spring-boot-starter-test')
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "com.vaadin:vaadin-bom:${vaadinVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}