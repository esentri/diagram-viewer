logging.level.root=INFO

# General
vaadin.launch-browser=true
vaadin.exclude-urls=/api/domain-model/**
spring.application.name=diagram-viewer
server.port=${SERVER_PORT:8090}

# Diagrams
diagrams.location=${DIAGRAMS_LOCATION:diagrams}
kroki.container.url=${KROKI_CONTAINER_URL:http://localhost:8000}
# must exceed Kroki's own conversion timeout (KROKI_COMMAND_TIMEOUT, 60s in the provided docker compose files)
kroki.request.timeoutSeconds=${KROKI_REQUEST_TIMEOUT_SECONDS:90}
diagrams.rendering.threads=${DIAGRAMS_RENDERING_THREADS:2}
diagrams.largeDiagramClasses=${DIAGRAMS_LARGE_DIAGRAM_CLASSES:1000}

# File-Upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Upload JAR
jar.upload.enabled=${JAR_UPLOAD_ENABLED:false}

### Every 30 seconds
regenerateDiagramsTask.rate=${REGENERATE_DIAGRAMS_TASK_RATE:30000}
regenerateDiagramsTask.maxAttempts=${REGENERATE_DIAGRAMS_TASK_MAX_ATTEMPTS:3}

# Project model cache (shared by all sessions): number of projects kept, and how long an unused one is kept
# memory budget of the shared project model cache; 0 means half of the maximum heap
projectModelCache.maximumMegabytes=${PROJECT_MODEL_CACHE_MAXIMUM_MEGABYTES:0}
projectModelCache.expireAfterAccessMinutes=${PROJECT_MODEL_CACHE_EXPIRE_AFTER_ACCESS_MINUTES:60}

# Actuator
management.endpoints.web.exposure.include=health

# Security
app.features.okta-login.enabled=${OKTA_LOGIN_ENABLED:false}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOSTNAME:localhost}:${DB_PORT:5432}/${DB_NAME:diagram-viewer-db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
