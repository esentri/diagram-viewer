logging.level.root=INFO

# General
vaadin.launch-browser=true
vaadin.exclude-urls=/api/domain-model/**
spring.application.name=diagram-viewer
server.port=${SERVER_PORT:8090}

# Diagrams
diagrams.location=${DIAGRAMS_LOCATION:diagrams}
kroki.container.url=${KROKI_CONTAINER_URL:http://localhost:8000}

# File-Upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Upload JAR
jar.upload.enabled=${JAR_UPLOAD_ENABLED:false}

### Every 30 seconds
regenerateDiagramsTask.rate=${REGENERATE_DIAGRAMS_TASK_RATE:30000}

# Actuator
management.endpoints.web.exposure.include=health

# Security
app.features.okta-login.enabled=${OKTA_LOGIN_ENABLED:false}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOSTNAME:localhost}:${DB_PORT:5432}/${DB_NAME:diagram-viewer-db}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
