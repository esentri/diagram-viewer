services:
  kroki:
    image: yuzutech/kroki:latest
    environment:
      # nomnoml conversions of large diagrams take longer than Kroki's default of 5s
      KROKI_COMMAND_TIMEOUT: ${KROKI_COMMAND_TIMEOUT:-60s}
    ports:
      - "8000:8000"
    networks:
      - diagram-viewer-network

  database:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diagram-viewer-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d diagram-viewer-db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - diagram-viewer-network

  diagram-viewer-app:
    dns:
      - 1.1.1.1
      - 8.8.8.8
    image: marioherb/dlc-diagram-viewer:latest
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/diagram-viewer-db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      KROKI_CONTAINER_URL: http://kroki:8000
      # heap for esprit_2-sized projects with several users, see README "Memory"
      JAVA_TOOL_OPTIONS: ${DIAGRAM_VIEWER_JAVA_OPTS:--Xmx2g -XX:+UseG1GC -XX:+UseStringDeduplication}
      OKTA_LOGIN_ENABLED: true
      OKTA_OAUTH2_ISSUER: https://esentri.okta.com
      OKTA_OAUTH2_CLIENT_ID: 0oa1vgjp7du46YjS21d8
      OKTA_OAUTH2_REDIRECT_URI: /authorization-code/callback
    depends_on:
      database:
        condition: service_healthy
    networks:
      - diagram-viewer-network

networks:
  diagram-viewer-network:
    driver: bridge
