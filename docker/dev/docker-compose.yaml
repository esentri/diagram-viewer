services:
  kroki:
    image: yuzutech/kroki:latest
    ports:
      - "8000:8000"
    networks:
      - diagram-viewer-network

  database:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: diagram-viewer-db
    networks:
      - diagram-viewer-network

networks:
  diagram-viewer-network:
    driver: bridge